<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NexDown</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0e0f14;
      color: #e2e4ef;
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 14px;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 24px;
      background: #151721;
      border-bottom: 1px solid #1e2130;
    }
    .logo {
      width: 36px; height: 36px;
      background: linear-gradient(135deg, #4f7cff, #a259ff);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; flex-shrink: 0;
    }
    .header-title { font-size: 18px; font-weight: 600; color: #fff; }
    .header-sub   { font-size: 13px; color: #666; }
    .status-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: #2d2d2d;
      transition: background 0.3s;
    }
    .status-dot.online  { background: #22c55e; box-shadow: 0 0 8px #22c55e88; }
    .status-dot.offline { background: #ef4444; }

    /* ── Main Dashboard Layout ── */
    .dashboard {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    .left-panel {
      flex: 1;
      padding: 24px;
      border-right: 1px solid #1e2130;
      display: flex;
      flex-direction: column;
      gap: 20px;
      overflow-y: auto;
    }

    .right-panel {
      width: 350px;
      display: flex;
      flex-direction: column;
      background: #11121a;
      border-left: 1px solid #1e2130;
    }

    /* ── Input Section ── */
    .input-section {
      background: #151721;
      border: 1px solid #1e2130;
      border-radius: 12px;
      padding: 20px;
    }
    .input-label { font-size: 13px; color: #8c8f9f; margin-bottom: 8px; letter-spacing: 0.3px; }

    .url-row {
      display: flex;
      gap: 12px;
    }
    .url-input {
      flex: 1;
      padding: 12px 16px;
      background: #1a1c28;
      border: 1px solid #252840;
      border-radius: 8px;
      color: #e2e4ef;
      font-size: 14px;
      outline: none;
      transition: border 0.2s;
    }
    .url-input:focus { border-color: #4f7cff; }
    .url-input::placeholder { color: #3a3d54; }

    /* ── Format + Quality Row ── */
    .options-row {
      display: flex;
      gap: 12px;
      margin-top: 12px;
    }
    select {
      flex: 1;
      padding: 12px 16px;
      background: #1a1c28;
      border: 1px solid #252840;
      border-radius: 8px;
      color: #c0c4d8;
      font-size: 13px;
      outline: none;
      cursor: pointer;
    }
    select:focus { border-color: #4f7cff; }

    /* ── Buttons ── */
    .btn-row { display: flex; gap: 12px; margin-top: 16px; }

    .btn-primary {
      flex: 1;
      padding: 14px;
      background: #4f7cff;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn-primary:hover   { background: #3b6be0; }
    .btn-primary:active  { transform: scale(0.98); }
    .btn-primary:disabled { background: #252840; color: #444; cursor: not-allowed; }

    .btn-playlist {
      flex: 1;
      padding: 14px;
      background: transparent;
      color: #a259ff;
      border: 1px solid #a259ff44;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn-playlist:hover { background: #a259ff15; border-color: #a259ff; }

    /* ── Error / Info ── */
    #msg-box {
      display: none;
      margin-top: 16px;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 13px;
    }
    #msg-box.error   { background: #2a1414; border: 1px solid #6b1a1a; color: #f87171; display: block; }
    #msg-box.success { background: #0f2a1a; border: 1px solid #145a30; color: #4ade80; display: block; }
    #msg-box.info    { background: #141a2a; border: 1px solid #1e2d5a; color: #93c5fd; display: block; }

    /* ── Queue ── */
    .queue-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px;
      border-bottom: 1px solid #1e2130;
      background: #151721;
    }
    .queue-title { font-size: 13px; color: #8c8f9f; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
    .btn-clear-all {
      font-size: 12px; color: #8c8f9f; background: none; border: none; cursor: pointer;
    }
    .btn-clear-all:hover { color: #ef4444; }

    #queue-list { 
      padding: 16px; 
      display: flex; 
      flex-direction: column; 
      gap: 12px; 
      overflow-y: auto;
      flex: 1;
    }

    .queue-empty {
      text-align: center;
      padding: 40px 0;
      color: #666;
      font-size: 14px;
    }
    .queue-empty-icon { font-size: 36px; display: block; margin-bottom: 12px; opacity: 0.4; }

    /* ── Queue Item ── */
    .q-item {
      background: #1a1c28;
      border: 1px solid #252840;
      border-radius: 10px;
      padding: 12px 16px;
    }
    .q-top { display: flex; align-items: center; gap: 10px; }
    .q-icon { font-size: 16px; flex-shrink: 0; }
    .q-name {
      flex: 1;
      font-size: 13px;
      color: #e2e4ef;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .q-badge {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 99px;
      flex-shrink: 0;
    }
    .q-badge.downloading { background: #1a2a4a; color: #4f7cff; }
    .q-badge.done        { background: #0f2a1a; color: #22c55e; }
    .q-badge.error       { background: #2a1414; color: #ef4444; }
    .q-badge.canceled    { background: #2a1f14; color: #f59e0b; }
    .q-badge.paused      { background: #2a2214; color: #f59e0b; }
    .q-badge.queued      { background: #1e1a2a; color: #a259ff; }
    .q-badge.playlist    { background: #2a1a2a; color: #c084fc; }

    .q-progress-wrap {
      margin-top: 10px;
      height: 4px;
      background: #252840;
      border-radius: 2px;
      overflow: hidden;
    }
    .q-progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #4f7cff, #a259ff);
      border-radius: 2px;
      transition: width 0.4s;
    }
    .q-sub {
      margin-top: 8px;
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: #8c8f9f;
    }
    .q-remove {
      font-size: 14px;
      color: #666;
      background: none;
      border: none;
      cursor: pointer;
      padding: 2px;
      transition: color 0.2s;
    }
    .q-remove:hover { color: #ef4444; }

    .q-btn {
      font-size: 12px;
      color: #8c8f9f;
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      transition: color 0.2s;
    }
    .q-btn:hover { color: #4f7cff; }

    /* ── Header Actions ── */
    .header-actions {
      margin-left: auto;
      margin-right: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header-btn {
      padding: 8px 14px;
      background: #1a1c28;
      border: 1px solid #252840;
      color: #c0c4d8;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }
    .header-btn:hover {
      background: #4f7cff15;
      border-color: #4f7cff;
      color: #fff;
    }
    .header-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* ── Playlist Range Row ── */
    .playlist-range-row {
      margin-top: 12px;
      display: none;
      flex-direction: column;
    }
    .playlist-range-row.show {
      display: flex;
    }

    /* ── Checkbox Row ── */
    .checkbox-row {
      margin-top: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: #c0c4d8;
      cursor: pointer;
      user-select: none;
    }
    .checkbox-label input {
      width: 16px;
      height: 16px;
      accent-color: #4f7cff;
      cursor: pointer;
    }

    /* ── Update Banner ── */
    #update-banner {
      display: none;
      background: linear-gradient(90deg, #4f7cff, #a259ff);
      color: #fff;
      padding: 10px 24px;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      font-weight: 600;
    }
    #update-banner.show { display: flex; }
    .btn-update {
      background: #fff;
      color: #4f7cff;
      border: none;
      border-radius: 6px;
      padding: 6px 12px;
      font-weight: 700;
      cursor: pointer;
      font-size: 12px;
      display: none;
    }
    .btn-update:hover { background: #f0f0f0; }

    /* ── Footer ── */
    .footer {
      background: #11121a;
      border-top: 1px solid #1e2130;
      text-align: center;
      padding: 10px;
      font-size: 12px;
      color: #8c8f9f;
    }
    .footer span {
      color: #4f7cff;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="logo">&#x2B07;</div>
    <div>
      <div class="header-title">NexDown Desktop</div>
      <div class="header-sub">Advanced Download Engine</div>
    </div>
    <div class="header-actions">
      <button class="header-btn" id="btn-check-update" title="Check for Updates">&#x21BB; Check for Updates</button>
      <button class="header-btn" id="btn-open-folder" title="Open Downloads Folder">&#x1F4C2; Open Folder</button>
    </div>
    <div class="status-dot" id="status-dot" title="Local Server Status"></div>
  </div>

  <!-- Update Banner -->
  <div id="update-banner">
    <span id="update-text">Checking for updates...</span>
    <button class="btn-update" id="btn-update-install">Restart & Install</button>
  </div>

  <div class="dashboard">
    <!-- Left Panel: Controls -->
    <div class="left-panel">
      
      <div class="input-section">
        <div class="input-label">Paste Video or Playlist URL</div>
        <div class="url-row">
          <input class="url-input" id="url-input" type="text" placeholder="https://youtube.com/watch?v=..." />
        </div>
        
        <!-- Playlist Range Selection -->
        <div class="playlist-range-row" id="playlist-range-row">
          <div class="input-label" style="margin-top: 12px; margin-bottom: 6px;">Playlist items (optional, e.g. 1-5, 8, 12-)</div>
          <input class="url-input" id="playlist-range-input" type="text" placeholder="e.g. 1-5, 10, 20-25" />
        </div>
        
        <div class="options-row">
          <select id="sel-format">
            <option value="mp4">MP4 (Video)</option>
            <option value="mp3">MP3 (Audio)</option>
            <option value="webm">WEBM</option>
          </select>
          <select id="sel-quality">
            <option value="best">Best quality</option>
            <option value="2160">2160p (4K)</option>
            <option value="1080">1080p</option>
            <option value="720">720p</option>
            <option value="480">480p</option>
            <option value="360">360p</option>
          </select>
        </div>
        
        <!-- Embed Metadata & Thumbnail option -->
        <div class="checkbox-row">
          <label class="checkbox-label">
            <input type="checkbox" id="chk-embed" checked />
            Embed Video Metadata & Thumbnail
          </label>
        </div>
        
        <!-- Download Path Input -->
        <div style="margin-top: 16px;">
          <div class="input-label" style="margin-bottom: 6px;">Custom Download Path (optional)</div>
          <input class="url-input" id="path-input" type="text" placeholder="Default: ~/Downloads/NexDown" style="width: 100%;" />
        </div>
        
        <div class="btn-row">
          <button class="btn-primary"  id="btn-download">&#x2B07; Download Video</button>
          <button class="btn-playlist" id="btn-playlist">&#x25B6;&#x25B6; Full Playlist</button>
        </div>
        
        <!-- Message box -->
        <div id="msg-box"></div>
      </div>
      
    </div>

    <!-- Right Panel: Queue -->
    <div class="right-panel">
      <div class="queue-header">
        <span class="queue-title" id="queue-count">0 items</span>
        <button class="btn-clear-all" id="btn-clear">Clear All</button>
      </div>
      <div id="queue-list">
        <div class="queue-empty">
          <span class="queue-empty-icon">&#x1F4C2;</span>
          No downloads yet
        </div>
      </div>
    </div>
  </div>

  <div class="footer">
    Developed by <span>Ahmad Khan</span> • <span>v1.0.1</span>
  </div>

  <script src="dashboard.js"></script>
</body>
</html>
